<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>اعرف الله · Know Allah</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="اعرف الله: آيات الله في الآفاق وفي الأنفس كما كشف العلم جانبًا منها، بأدلتها ومصادرها الموثّقة، وأسماؤه الحسنى بشرحٍ موجز — Know Allah through His signs in creation, with verified sources, and His Beautiful Names, briefly explained.">
  <meta name="theme-color" content="#080c1c">
  <meta property="og:title" content="اعرف الله · Know Allah">
  <meta property="og:description" content="آياتٌ في الآفاق وفي الأنفس، وأسماء الله الحسنى، بأدلتها من القرآن والسنة.">
  <!-- Apply the saved colour theme before first paint, so nothing flashes. The address gives the
       page's language: /en/… is English, the plain addresses Arabic. A reader who chose the other
       language with the switch is sent to this page in it, hidden meanwhile; search engines keep no
       choice, so they find every page in both languages. Without JavaScript, what would fade in on
       scrolling (shared/reveal.ts) is simply shown. -->
  <style>
    html.relang app-root { visibility: hidden; }
    html:not(.js) .reveal { opacity: 1; translate: none; }
  </style>
  <script>
    var html = document.documentElement;
    html.classList.add('js');
    try {
      var theme = localStorage.getItem('ayat.theme');
      html.dataset.theme = /^(night|paper|black|white|blue|navy|pink)$/.test(theme) ? theme : 'night';
      var chosen = localStorage.getItem('ayat.lang');
      var base = document.querySelector('base').getAttribute('href');
      var path = location.pathname;
      if ((chosen === 'ar' || chosen === 'en') && path.indexOf(base) === 0) {
        var rest = path.slice(base.length);
        var english = /^en(\/|$)/.test(rest);
        if (english !== (chosen === 'en')) {
          html.classList.add('relang');
          location.replace(base + (english ? rest.replace(/^en\/?/, '') : 'en/' + rest) + location.search + location.hash);
        }
      }
    } catch (e) {}
  </script>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@300;400;500;600;700&display=swap">
</head>
<body>
  <app-root></app-root>
</body>
</html>
