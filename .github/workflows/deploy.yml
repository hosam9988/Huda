# Builds the app and publishes it to GitHub Pages on every push to main.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Refuse to publish content with a missing translation, source or field.
      - run: npm run check:content

      # Pages serves the site from /<repo-name>/, so the base href must match.
      - run: npx ng build --base-href "/${{ github.event.repository.name }}/"

      # Pages has no SPA fallback: serve index.html for deep links like /ayah/expanding-universe.
      - run: cp dist/huda/browser/index.html dist/huda/browser/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/huda/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
