# Builds the app and publishes it to GitHub Pages on every push to main, and, on the journey
# branch, on every push to journey: the owner has the live site follow journey while main is
# left as it is (2026-11-18). The github-pages environment allows both branches.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, journey]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Refuse to publish content with a missing translation, source or field.
      - run: npm run check:content

      # Prerenders every page into an HTML file of its own, so that Pages answers each sign and name
      # as a page (200) that search engines index. Pages serves the site from /Huda/, the base href
      # in angular.json. scripts/finish-build.mjs then lays the files out for Pages, adds 404.html,
      # sitemap.xml and robots.txt, and fails the build if a page lacks its text or address.
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/huda/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
